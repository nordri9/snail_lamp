<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ESP32 LED Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <h1>🐌 Control</h1>
    <div class="control-group">
        <p>Current 🐌 Status: <span id="ledStatus" class="off">OFF</span></p>
        <button id="toggleButton">Toggle LED On/Off</button>
    </div>
    
    <div class="control-group">
        <h2>Brightness Control</h2>
        <input type="range" id="brightnessSlider" min="0" max="255" value="255">
        <p>Brightness: <span id="brightnessValue">255</span></p>
    </div>

    <div class="control-group">
        <h2>Color Control</h2>
        <input type="range" id="colorSlider" min="0" max="359" value="0">
        <div id="currentColorDisplay" style="width: 50px; height: 50px; border: 1px solid #ccc; margin: 10px auto;"></div>
        <p>Use the toggle button to turn LEDs ON before setting color.</p>
    </div>

    <script src="/script.js"></script>
</body>

</html>
