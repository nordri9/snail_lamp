<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>ESP32 LED Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <h1>Hello, I'm Persephone, your personal glowing snail!</h1>
    <h2>How do you want me to shine?</h2>
    <div class="control-group">
        <p>Current 🐌 Status: <span id="ledStatus" class="off">OFF</span></p>
        <button id="toggleButton">Tickle me On/Off</button>
    </div>

    <div class="control-group">
        <h2>✨How bright do you want me to glow?✨</h2>
        <input type="range" id="brightnessSlider" min="0" max="255" value="255">
        <p>Shininess: <span id="brightnessValue">255</span></p>
    </div>

    <div class="control-group">
        <h2>🌈I can be any color for you!🌈</h2>
        <input type="range" id="colorSlider" min="0" max="359" value="0">
        <div id="currentColorDisplay" style="width: 50px; height: 50px; border: 1px solid #ccc; margin: 10px auto;">
        </div>
        <p>Use the tickle button to wake me up before giving me a color ^^</p>
    </div>

    <div class="control-group">
        <h2>LED Effects</h2>
        <select id="effectSelect">
            <option value="0">-- Select Effect --</option>
            <option value="1">Rainbow Cycle</option>
            <option value="2">Theater Chase (Red)</option>
            <option value="3">Sparkle</option>
            <option value="4">Wave (Blue)</option>
        </select>
        <br><br>
        <button id="startEffectButton">Start Effect</button>
        <button id="stopEffectButton">Stop Effect</button>
    </div>

        <h2>⚡How fast should I animate?⚡</h2>
        <input type="range" id="speedSlider" min="10" max="500" value="50">
        <p>Animation Speed: <span id="speedValue">50</span>ms</p>
    </div>
-->
    <script src="/script.js"></script>
</body>

</html>
