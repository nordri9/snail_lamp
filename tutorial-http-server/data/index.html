<!DOCTYPE html>
<html>

<head>
    <title>ESP32 LED Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <h1>LED Control</h1>
        <p>Current LED Status: <span id="ledStatus" class="off">OFF</span></p>
        <button id="toggleButton">Toggle LED</button>

        <p>Slider Value: <span id="sliderValue">0</span></p>
        <input type="range" min="0" max="255" value="0" class="slider" id="mySlider">
    </div>

    <script src="/script.js"></script>
</body>

</html>
